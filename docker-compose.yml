services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: budgetiq-backend:latest
    container_name: budgetiq-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: budgetiq-frontend:latest
    container_name: budgetiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy